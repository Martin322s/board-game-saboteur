# Supabase CLI configuration for local development (https://supabase.com/docs/guides/local-development).
# Hosted projects are configured in the dashboard; keep the two in sync where noted.
project_id = "tunnels"

[api]
enabled = true
port = 55321
# Only `public` is exposed through the Data API. Internal helpers live in the `private` schema.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = true

# Authoritative gameplay commands (supabase/functions/game-command). The gateway rejects requests
# without a valid JWT; the function additionally resolves the user server-side.
# Secrets come from the platform (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY); ALLOWED_ORIGINS
# (comma-separated) restricts CORS and defaults to the local Vite origins.
[functions.game-command]
verify_jwt = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Players are anonymous Supabase users (ARCHITECTURE §9.1). Mirror this in the hosted dashboard.
enable_anonymous_sign_ins = true

[auth.rate_limit]
# Anonymous sign-ins per hour per IP. CAPTCHA (Turnstile) is added in a later iteration.
anonymous_users = 30

[auth.email]
enable_signup = false
